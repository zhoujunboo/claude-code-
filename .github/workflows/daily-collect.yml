name: Daily Collect

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-knowledge-base-v2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ai-knowledge-base-v2/package.json

      - run: npm install

      - name: Run pipeline
        run: npx tsx pipeline/pipeline.ts --sources github,rss --limit 20 --verbose
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Validate
        run: |
          npx tsx hooks/validate_json.ts knowledge/articles/*.json
          npx tsx hooks/check_quality.ts knowledge/articles/*.json

      - name: Commit and push if changes
        run: |
          DATE=$(date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge/articles/ knowledge/raw/
          if git diff --cached --quiet; then
            echo "No new data, skipping commit"
          else
            ARTICLE_COUNT=$(git diff --cached --name-only -- knowledge/articles/ | wc -l)
            git commit -m "chore: 采集 ${ARTICLE_COUNT} 篇文章 - ${DATE}"
            git push
          fi
